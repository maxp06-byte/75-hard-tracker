<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>75 Hard Tracker</title>

  <!-- Web App Capabilities (Hides Browser Address Bar) -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#121212">

  <!-- Dynamic Web App Manifest -->
  <link rel="manifest" id="manifest-placeholder">

  <style>
    :root {
      --bg: #121212;
      --card: #1e1e1e;
      --accent: #ff4500;
      --text: #ffffff;
      --muted: #a0a0a0;
      --border: #333333;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding-bottom: 20px; }
    
    /* Header */
    header {
      display: flex; justify-content: space-between; align-items: center;
      padding: 16px; background-color: var(--card); border-bottom: 1px solid var(--border);
      position: sticky; top: 0; z-index: 10;
    }
    .hamburger { font-size: 24px; background: none; border: none; color: var(--text); cursor: pointer; }
    .counter-btn {
      background: #2a2a2a; border: 1px solid var(--border); color: var(--accent);
      padding: 6px 12px; border-radius: 20px; font-weight: bold; font-size: 14px; cursor: pointer;
    }

    /* Sidebar Drawer */
    .drawer {
      position: fixed; top: 0; left: -250px; width: 250px; height: 100%;
      background: var(--card); z-index: 100; transition: 0.3s;
      border-right: 1px solid var(--border); padding-top: 60px;
    }
    .drawer.open { left: 0; }
    .drawer a {
      display: block; padding: 16px 24px; color: var(--text);
      text-decoration: none; border-bottom: 1px solid var(--border); font-size: 16px;
    }
    .overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.5); display: none; z-index: 99;
    }
    .overlay.active { display: block; }

    /* Main Container */
    .container { padding: 16px; max-width: 500px; margin: 0 auto; }
    .page { display: none; }
    .page.active { display: block; }

    /* Cards & Checklist */
    .card { background: var(--card); border-radius: 12px; padding: 16px; margin-bottom: 16px; border: 1px solid var(--border); }
    h2 { font-size: 18px; margin-bottom: 12px; }
    .date-bar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; background: #2a2a2a; padding: 8px 12px; border-radius: 8px; border: 1px solid var(--border); }
    .date-bar label { margin: 0; font-size: 13px; color: var(--muted); }
    .date-bar input { width: auto; background: transparent; border: none; color: var(--text); font-weight: bold; font-size: 14px; text-align: right; }

    .task-item { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--border); }
    .task-item:last-child { border-bottom: none; }
    .task-item input[type="checkbox"] { width: 22px; height: 22px; accent-color: var(--accent); }
    .task-item label { font-size: 15px; flex-grow: 1; }

    /* Photo Upload */
    .file-input { display: none; }
    .upload-btn {
      display: inline-block; padding: 8px 14px; background: #2a2a2a; border: 1px solid var(--border);
      color: var(--text); border-radius: 8px; font-size: 13px; cursor: pointer; text-align: center;
    }
    .photo-preview { width: 100%; max-height: 250px; object-fit: cover; border-radius: 8px; margin-top: 10px; display: none; }

    /* Form Fields */
    .form-group { margin-bottom: 12px; }
    label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 4px; }
    select, input { width: 100%; padding: 10px; background: #2a2a2a; border: 1px solid var(--border); color: var(--text); border-radius: 8px; font-size: 15px; }
    .btn { width: 100%; padding: 12px; background: var(--accent); border: none; color: white; border-radius: 8px; font-weight: bold; font-size: 16px; margin-top: 8px; }
    .field-hidden { display: none; }

    /* Photo Gallery Grid */
    .gallery-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; }
    .gallery-item { background: #252525; border-radius: 6px; overflow: hidden; border: 1px solid var(--border); text-align: center; }
    .gallery-item img { width: 100%; height: 110px; object-fit: cover; display: block; }
    .gallery-item span { display: block; font-size: 11px; padding: 4px; color: var(--muted); }

    /* Workout Cards with Delete Action */
    .workout-card { 
      background: #252525; padding: 12px; border-radius: 8px; margin-top: 8px; 
      font-size: 14px; border-left: 4px solid var(--accent);
      display: flex; justify-content: space-between; align-items: center;
    }
    .delete-btn {
      background: none; border: none; color: #ff5555; font-size: 18px; 
      cursor: pointer; padding: 4px 8px;
    }

    /* Filters */
    .filter-bar { display: flex; gap: 8px; margin-bottom: 12px; overflow-x: auto; padding-bottom: 4px; }
    .filter-chip { background: #2a2a2a; border: 1px solid var(--border); color: var(--text); padding: 6px 12px; border-radius: 16px; font-size: 13px; white-space: nowrap; }
    .filter-chip.active { background: var(--accent); border-color: var(--accent); }
  </style>
</head>
<body>

  <header>
    <button class="hamburger" onclick="toggleMenu()">☰</button>
    <h3 id="header-title">Day 1</h3>
    <button class="counter-btn" id="counter-toggle" onclick="switchCounterMode()">75 Days Left</button>
  </header>

  <div class="overlay" id="overlay" onclick="toggleMenu()"></div>
  <div class="drawer" id="drawer">
    <a href="#" onclick="navigate('home')">Daily Tracker</a>
    <a href="#" onclick="navigate('gallery')">Progress Photos (75)</a>
    <a href="#" onclick="navigate('calendar')">Calendar View</a>
    <a href="#" onclick="navigate('workouts')">Workout Logs</a>
  </div>

  <div class="container">
    <!-- PAGE 1: DAILY TRACKER -->
    <div id="page-home" class="page active">
      <div class="card">
        <div class="date-bar">
          <label>Logging For Date:</label>
          <input type="date" id="tracker-date-picker" onchange="changeTrackerDate()">
        </div>

        <h2>Daily Checklist</h2>
        
        <div class="task-item" style="flex-direction: column; align-items: flex-start;">
          <div style="display: flex; align-items: center; gap: 12px; width: 100%;">
            <input type="checkbox" id="task-photo" onchange="saveChecklist()">
            <label for="task-photo">Progress Picture</label>
            <label for="photo-file" class="upload-btn">📷 Upload</label>
            <input type="file" id="photo-file" class="file-input" accept="image/*" onchange="handlePhotoUpload(event)">
          </div>
          <img id="today-photo-preview" class="photo-preview" alt="Progress Photo Preview">
        </div>

        <div class="task-item">
          <input type="checkbox" id="task-water" onchange="saveChecklist()">
          <label for="task-water">3.8L Water</label>
        </div>
        <div class="task-item">
          <input type="checkbox" id="task-read" onchange="saveChecklist()">
          <label for="task-read">10 Pages Read (Non-Fiction)</label>
        </div>
        <div class="task-item">
          <input type="checkbox" id="task-w1" onchange="saveChecklist()">
          <label for="task-w1">45 Min Outdoor Workout</label>
        </div>
        <div class="task-item">
          <input type="checkbox" id="task-w2" onchange="saveChecklist()">
          <label for="task-w2">45 Min Indoor/Second Workout</label>
        </div>
      </div>

      <!-- Quick Log Workout -->
      <div class="card">
        <h2>Log a Workout Session</h2>
        <form id="workout-form" onsubmit="logWorkout(event)">
          <div class="form-group">
            <label>Workout Type</label>
            <select id="w-type" onchange="adjustWorkoutFields()">
              <option value="Gym/Strength">Gym / Strength</option>
              <option value="Running">Running</option>
              <option value="Walking">Walking</option>
              <option value="Yoga">Yoga</option>
              <option value="Football/Futsal">Football / Futsal</option>
              <option value="Cycling">Cycling</option>
              <option value="eBike">eBike</option>
              <option value="Breathwork">Breathwork</option>
              <option value="Swimming">Swimming</option>
              <option value="Hiking">Hiking</option>
            </select>
          </div>
          <div class="form-group">
            <label>Duration (minutes)</label>
            <input type="number" id="w-duration" placeholder="e.g. 45" required>
          </div>
          <div class="form-group" id="group-distance">
            <label>Distance (km)</label>
            <input type="number" step="0.01" id="w-distance" placeholder="e.g. 5.2">
          </div>
          <div class="form-group field-hidden" id="group-weight">
            <label>Weights / Focus Details</label>
            <input type="text" id="w-weight" placeholder="e.g. Legs, 80kg Squats">
          </div>
          <button type="submit" class="btn">Save Workout Log</button>
        </form>
      </div>
    </div>

    <!-- PAGE 2: PHOTO GALLERY -->
    <div id="page-gallery" class="page">
      <h2>Progress Photo Gallery</h2>
      <p style="color: var(--muted); font-size:13px; margin-top:4px;">All uploaded progress pictures across your 75 days.</p>
      <div class="gallery-grid" id="gallery-container"></div>
    </div>

    <!-- PAGE 3: CALENDAR -->
    <div id="page-calendar" class="page">
      <div class="card">
        <h2>Select Date</h2>
        <input type="date" id="calendar-picker" onchange="loadCalendarDayData()">
      </div>
      <div class="card" id="calendar-results">
        <p style="color: var(--muted);">Pick a date above to inspect completed tasks, photos, and logged sessions.</p>
      </div>
    </div>

    <!-- PAGE 4: WORKOUT LOGS -->
    <div id="page-workouts" class="page">
      <h2>All Logged Workouts</h2>
      <div class="filter-bar" style="margin-top: 12px;">
        <button class="filter-chip active" onclick="filterWorkouts('All', this)">All</button>
        <button class="filter-chip" onclick="filterWorkouts('Running', this)">Running</button>
        <button class="filter-chip" onclick="filterWorkouts('Gym/Strength', this)">Gym</button>
        <button class="filter-chip" onclick="filterWorkouts('Walking', this)">Walking</button>
        <button class="filter-chip" onclick="filterWorkouts('Yoga', this)">Yoga</button>
        <button class="filter-chip" onclick="filterWorkouts('Football/Futsal', this)">Football</button>
        <button class="filter-chip" onclick="filterWorkouts('Cycling', this)">Cycling</button>
        <button class="filter-chip" onclick="filterWorkouts('eBike', this)">eBike</button>
        <button class="filter-chip" onclick="filterWorkouts('Breathwork', this)">Breathwork</button>
        <button class="filter-chip" onclick="filterWorkouts('Swimming', this)">Swimming</button>
        <button class="filter-chip" onclick="filterWorkouts('Hiking', this)">Hiking</button>
      </div>
      <div id="workouts-list"></div>
    </div>
  </div>

  <script>
    // Generate Manifest dynamically so Chrome installs it standalone
    const manifestData = {
      name: "75 Hard Tracker",
      short_name: "75 Hard",
      start_url: window.location.origin + window.location.pathname,
      display: "standalone",
      background_color: "#121212",
      theme_color: "#121212",
      icons: [{ src: "https://cdn-icons-png.flaticon.com/512/1216/1216721.png", sizes: "512x512", type: "image/png" }]
    };
    const stringManifest = JSON.stringify(manifestData);
    const blob = new Blob([stringManifest], {type: 'application/json'});
    document.getElementById('manifest-placeholder').setAttribute('href', URL.createObjectURL(blob));

    let startDate = localStorage.getItem('75_startDate');
    if (!startDate) {
      startDate = new Date().toISOString().split('T')[0];
      localStorage.setItem('75_startDate', startDate);
    }
    
    let counterDisplayMode = localStorage.getItem('75_counterMode') || 'left';
    
    // Always default active log date to actual current date
    let activeLogDate = new Date().toISOString().split('T')[0];
    let currentFilter = 'All';

    function setDateToToday() {
      activeLogDate = new Date().toISOString().split('T')[0];
      const picker = document.getElementById('tracker-date-picker');
      if (picker) picker.value = activeLogDate;
      updateHeaderCounter();
      loadChecklist();
    }

    function calculateDayStats() {
      const start = new Date(startDate);
      const current = new Date(activeLogDate);
      const diffDays = Math.floor((current - start) / (1000 * 60 * 60 * 24)) + 1;
      const dayNum = Math.max(1, Math.min(diffDays, 75));
      const daysLeft = 75 - dayNum;
      return { dayNum, daysLeft };
    }

    function updateHeaderCounter() {
      const { dayNum, daysLeft } = calculateDayStats();
      const btn = document.getElementById('counter-toggle');
      document.getElementById('header-title').innerText = `Day ${dayNum}`;
      btn.innerText = counterDisplayMode === 'left' ? `${daysLeft} Days Left` : `Day ${dayNum} / 75`;
    }

    function switchCounterMode() {
      counterDisplayMode = counterDisplayMode === 'left' ? 'elapsed' : 'left';
      localStorage.setItem('75_counterMode', counterDisplayMode);
      updateHeaderCounter();
    }

    function changeTrackerDate() {
      activeLogDate = document.getElementById('tracker-date-picker').value;
      updateHeaderCounter();
      loadChecklist();
    }

    function toggleMenu() {
      document.getElementById('drawer').classList.toggle('open');
      document.getElementById('overlay').classList.toggle('active');
    }

    function navigate(pageId) {
      document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
      document.getElementById(`page-${pageId}`).classList.add('active');
      toggleMenu();
      if (pageId === 'workouts') renderAllWorkouts(currentFilter);
      if (pageId === 'gallery') renderGallery();
    }

    function getTaskKey() { return `75_tasks_${activeLogDate}`; }

    function handlePhotoUpload(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        const img = new Image();
        img.onload = function() {
          const canvas = document.createElement('canvas');
          let width = img.width;
          let height = img.height;
          const maxDim = 600;

          if (width > height && width > maxDim) {
            height *= maxDim / width;
            width = maxDim;
          } else if (height > maxDim) {
            width *= maxDim / height;
            height = maxDim;
          }

          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);

          const compressedDataUrl = canvas.toDataURL('image/jpeg', 0.7);

          localStorage.setItem(`75_photo_${activeLogDate}`, compressedDataUrl);
          document.getElementById('task-photo').checked = true;
          saveChecklist();

          const preview = document.getElementById('today-photo-preview');
          preview.src = compressedDataUrl;
          preview.style.display = 'block';
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    function loadChecklist() {
      const data = JSON.parse(localStorage.getItem(getTaskKey()) || '{}');
      document.getElementById('task-photo').checked = !!data.photo;
      document.getElementById('task-water').checked = !!data.water;
      document.getElementById('task-read').checked = !!data.read;
      document.getElementById('task-w1').checked = !!data.w1;
      document.getElementById('task-w2').checked = !!data.w2;

      const savedPhoto = localStorage.getItem(`75_photo_${activeLogDate}`);
      const preview = document.getElementById('today-photo-preview');
      if (savedPhoto) {
        preview.src = savedPhoto;
        preview.style.display = 'block';
      } else {
        preview.style.display = 'none';
        preview.src = '';
      }
    }

    function saveChecklist() {
      const data = {
        photo: document.getElementById('task-photo').checked,
        water: document.getElementById('task-water').checked,
        read: document.getElementById('task-read').checked,
        w1: document.getElementById('task-w1').checked,
        w2: document.getElementById('task-w2').checked,
      };
      localStorage.setItem(getTaskKey(), JSON.stringify(data));
    }

    function renderGallery() {
      const gallery = document.getElementById('gallery-container');
      gallery.innerHTML = '';

      let found = 0;
      for (let i = 0; i < localStorage.length; i++) {
        const key = localStorage.key(i);
        if (key.startsWith('75_photo_')) {
          const date = key.replace('75_photo_', '');
          const imgUrl = localStorage.getItem(key);
          found++;

          gallery.innerHTML += `
            <div class="gallery-item">
              <img src="${imgUrl}" alt="Progress ${date}">
              <span>${date}</span>
            </div>
          `;
        }
      }

      if (found === 0) {
        gallery.innerHTML = '<p style="color:var(--muted); grid-column: 1/-1;">No progress pictures uploaded yet!</p>';
      }
    }

    function adjustWorkoutFields() {
      const type = document.getElementById('w-type').value;
      const distGroup = document.getElementById('group-distance');
      const weightGroup = document.getElementById('group-weight');

      if (type === 'Gym/Strength') {
        distGroup.classList.add('field-hidden');
        weightGroup.classList.remove('field-hidden');
      } else if (type === 'Running' || type === 'Walking'|| type === 'Cycling' || type === 'eBike' || type === 'Hiking' || type === 'Swimming') {
        distGroup.classList.remove('field-hidden');
        weightGroup.classList.add('field-hidden');
      } else {
        distGroup.classList.add('field-hidden');
        weightGroup.classList.add('field-hidden');
      }
    }

    function getWorkouts() {
      return JSON.parse(localStorage.getItem('75_workouts') || '[]');
    }

    function logWorkout(e) {
      e.preventDefault();
      const type = document.getElementById('w-type').value;
      const duration = document.getElementById('w-duration').value;
      const distance = document.getElementById('w-distance').value;
      const weight = document.getElementById('w-weight').value;

      const newLog = {
        id: Date.now(),
        date: activeLogDate,
        type,
        duration: duration + ' mins',
        extra: distance ? `${distance} km` : (weight || '')
      };

      const logs = getWorkouts();
      logs.unshift(newLog);
      localStorage.setItem('75_workouts', JSON.stringify(logs));

      document.getElementById('workout-form').reset();
      adjustWorkoutFields();
      alert(`Workout Logged for ${activeLogDate}!`);
    }

    function deleteWorkout(id) {
      if (!confirm("Are you sure you want to delete this workout log?")) return;
      
      let logs = getWorkouts();
      logs = logs.filter(w => w.id !== id);
      localStorage.setItem('75_workouts', JSON.stringify(logs));

      renderAllWorkouts(currentFilter);
      if (document.getElementById('calendar-picker').value) {
        loadCalendarDayData();
      }
    }

    function renderAllWorkouts(filter = 'All') {
      currentFilter = filter;
      const logs = getWorkouts();
      const listEl = document.getElementById('workouts-list');
      listEl.innerHTML = '';

      const filtered = filter === 'All' ? logs : logs.filter(l => l.type === filter);

      if (filtered.length === 0) {
        listEl.innerHTML = '<p style="color: var(--muted); margin-top: 12px;">No logged workouts found.</p>';
        return;
      }

      filtered.forEach(item => {
        listEl.innerHTML += `
          <div class="workout-card">
            <div>
              <strong>${item.type}</strong> — ${item.date}<br>
              <span style="color: var(--muted);">Duration: ${item.duration} ${item.extra ? '| ' + item.extra : ''}</span>
            </div>
            <button class="delete-btn" onclick="deleteWorkout(${item.id})" title="Delete entry">🗑️</button>
          </div>
        `;
      });
    }

    function filterWorkouts(category, btn) {
      document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
      btn.classList.add('active');
      renderAllWorkouts(category);
    }

    function loadCalendarDayData() {
      const selectedDate = document.getElementById('calendar-picker').value;
      if (!selectedDate) return;

      const tasks = JSON.parse(localStorage.getItem(`75_tasks_${selectedDate}`) || '{}');
      const photo = localStorage.getItem(`75_photo_${selectedDate}`);
      const allWorkouts = getWorkouts().filter(w => w.date === selectedDate);
      const resEl = document.getElementById('calendar-results');

      let html = `<h3 style="margin-bottom:8px;">Logs for ${selectedDate}</h3>`;
      
      if (photo) {
        html += `<img src="${photo}" style="width:100%; max-height:200px; object-fit:cover; border-radius:8px; margin-bottom:12px;">`;
      }

      html += `<strong>Daily Checklist:</strong><ul style="margin: 8px 0 16px 20px; font-size:14px;">`;
      html += `<li>Progress Photo: ${tasks.photo ? '✓' : '✗'}</li>`;
      html += `<li>3.8L Water: ${tasks.water ? '✓' : '✗'}</li>`;
      html += `<li>10 Pages Read: ${tasks.read ? '✓' : '✗'}</li>`;
      html += `<li>Outdoor Workout: ${tasks.w1 ? '✓' : '✗'}</li>`;
      html += `<li>Indoor Workout: ${tasks.w2 ? '✓' : '✗'}</li></ul>`;

      html += `<strong>Logged Sessions (${allWorkouts.length}):</strong>`;
      if (allWorkouts.length === 0) {
        html += `<p style="font-size:13px; color:var(--muted);">No specific workouts recorded.</p>`;
      } else {
        allWorkouts.forEach(w => {
          html += `
            <div class="workout-card">
              <div>
                <strong>${w.type}</strong> - ${w.duration} ${w.extra ? ' (' + w.extra + ')' : ''}
              </div>
              <button class="delete-btn" onclick="deleteWorkout(${w.id})" title="Delete entry">🗑️</button>
            </div>`;
        });
      }

      resEl.innerHTML = html;
    }

    // Initialize & refresh date when returning to the app
    setDateToToday();
    adjustWorkoutFields();
    window.addEventListener('focus', setDateToToday);
  </script>
</body>
</html>
